name = "free-citation-generator"
main = "worker.js"
compatibility_date = "2024-11-01"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[routes]]
pattern = "free-citation-generator.web-free.site"
custom_domain = true